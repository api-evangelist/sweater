name: Sweater
description: Sweater (سويتر) is a Saudi Arabian on-demand mobile car-care company that brings waterless
  vehicle washing, interior cleaning, detailing, and fragrance services to customers wherever their car
  is parked. Its app-based platform uses smart scheduling to dispatch field teams by location and uses
  roughly 7 liters of water per wash versus about 120 liters for traditional methods. The company reports
  2M+ washes, 750K+ users, 500+ corporate partnerships, and operations across 8 Saudi cities (Riyadh,
  Dammam, Khobar, Jeddah, Jubail, Medina, Al-Hassa, and Mecca). Surfaced as a 500 Global portfolio
  company. It is a consumer/B2B services business with no public developer API surface at this time.
